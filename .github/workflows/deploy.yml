name: Deploy
# Every push to main: tests, then the Convex backend, then the site on GitHub Pages (icgceipt.hillsbuilds.com).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_TYPEKIT_ID: ${{ vars.TYPEKIT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy the backend, then build the site against it
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: |
          # Some copy paths turn the key's "|" into "%7C". A real key never contains it, so undo it.
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7C/|}"
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7c/|}"
          npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL
          echo "Settings on live (names only): $(npx convex env list 2>/dev/null | cut -d= -f1 | sort | tr '\n' ' ')"
      - name: Build the site only (no backend key yet)
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
